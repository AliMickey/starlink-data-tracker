{% extends 'builders/base.html' %}

{% block title %}Register{% endblock %}

{% block scriptsHead %}
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
{% endblock %}

{% block content %}
  <div class="col-md-4">
    <h1 class="fs-2 fw-normal mb-3">Register</h1>
    <form method="POST">
      <div class="form-floating mb-3">
        <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        <label for="email">Email Address</label>
      </div>
      <div class="mb-3">
        <div class="form-floating">
          <input class="form-control" type="text" id="username" name="username" placeholder="Username" autocomplete="username" maxlength="10" aria-describedby="usernameHelp" required>
          <label for="username">Username</label>
        </div>
        <div class="form-text" id="usernameHelp">Up to 10 characters.</div>
      </div>
      <div class="mb-3">
        <div class="form-floating">
          <input class="form-control" type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" minlength="8" aria-describedby="passwordHelp" required>
          <label for="password">Password</label>
        </div>
        <div class="form-text" id="passwordHelp">At least 8 characters.</div>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" type="password" id="passwordRepeat" name="passwordRepeat" placeholder="Password Repeat" autocomplete="new-password" minlength="8" required>
        <label for="passwordRepeat">Repeat Password</label>
      </div>
      <div class="row mb-3">
        <div class="h-captcha" data-sitekey="aafc7d0b-a725-4505-b869-151b26246ef2"></div>
      </div>
      <div class="row mb-3">
        <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></p>
      </div>
      <div class="mb-3">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>
{% endblock %}
