{% extends 'builders/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
  <div class="col-md-4">
    <h1 class="fs-2 fw-normal mb-3">Login</h1>
    <a class="btn btn-primary m-1" href="https://www.starlink.com/?referral=RC-138996-16190-20" target="_blank" rel="noopener noreferrer" data-umami-event="login_buy_starlink">Buy Starlink</a>
    <br><br>
    <form method="POST">
      <div class="form-floating mb-3">
        <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        <label for="email">Email Address</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <label for="password">Password</label>
      </div>
      <div class="row mb-3">
        <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
        <p>Forgot your password? <a href="{{ url_for('auth.forgotPassword') }}">Reset</a></p>
      </div>
      <div class="mb-3">
        <button type="submit" class="btn btn-primary">Log in</button>
      </div>
    </form>
  </div>
{% endblock %}
